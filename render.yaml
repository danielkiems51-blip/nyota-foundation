services:
  - type: web
    name: nyota-fund
    env: python
    buildCommand: ./build.sh
    startCommand: gunicorn nyota_fund.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: 'False'
      - key: PAYNEXUS_API_URL
        value: 'https://paynexus.co.ke/api/mpesa/payment/initiate'
      - key: PAYNEXUS_API_KEY
        sync: false
      - key: PAYNEXUS_CALLBACK_URL
        value: 'https://nyota-foundations16.onrender.com/api/mpesa/callback/'
